<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; media-src brainrot-media:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Brainrot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Локальное приложение</p>
    <h1>Claude Brainrot</h1>
    <p>Импортируйте собственные видео WebM или MP4. Звук выключен по умолчанию.</p>
    <p id="notice" role="status"></p>
    <div id="global-controls" class="controls" aria-label="Все слоты">
      <button data-action="pause">Пауза всем</button>
      <button data-action="resume">Продолжить всем</button>
      <button data-action="next">Следующее всем</button>
      <button data-action="shuffle">Перемешать всем</button>
    </div>
    <div id="slots" aria-label="Локальные видео"></div>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
